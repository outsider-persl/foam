# 版本管理的唯一声明来源。
# 规则：
#   - [libraries] 不带 version.ref 的条目：版本交给 Spring Boot BOM 管理（仅限应用 foam.spring-boot-app 的模块）
#   - [libraries] 带 version.ref 的条目：模块自己管理，版本显式写在 [versions]
# 不要在 toml 中重复记录 Spring Boot BOM 已管理的版本值（如 micrometer、lombok、zipkin）。

[versions]
spring-boot = "4.1.1"
spring-cloud = "2025.1.3"            # Oakwood：2025.1.2 起适配 Spring Boot 4.1.x
spring-cloud-alibaba = "2025.1.0.0"  # 适配 Spring Cloud 2025.1.x / Spring Boot 4.x
junit = "6.0.3"   # 与 Spring Boot 4.1.1 BOM 的 junit-bom 对齐
# 与 Spring Boot 4.1.1 Gradle 插件内置的版本保持一致
dependency-management = "1.1.7"

[libraries]
# 由 Spring Boot BOM 管理版本（不写 version.ref）
spring-boot-starter-webmvc = { group = "org.springframework.boot", name = "spring-boot-starter-webmvc" }
spring-boot-starter-test = { group = "org.springframework.boot", name = "spring-boot-starter-test" }
spring-boot-starter-actuator = { group = "org.springframework.boot", name = "spring-boot-starter-actuator" }
micrometer-registry-prometheus = { group = "io.micrometer", name = "micrometer-registry-prometheus" }
# 由 Spring Cloud BOM 管理版本（不写 version.ref）
spring-cloud-starter-gateway-server-webflux = { group = "org.springframework.cloud", name = "spring-cloud-starter-gateway-server-webflux" }
# 由 Spring Cloud Alibaba BOM 管理版本（不写 version.ref，按需引入）
spring-cloud-starter-alibaba-nacos-discovery = { group = "com.alibaba.cloud", name = "spring-cloud-starter-alibaba-nacos-discovery" }
spring-cloud-starter-alibaba-nacos-config = { group = "com.alibaba.cloud", name = "spring-cloud-starter-alibaba-nacos-config" }

# 模块自己管理版本（写 version.ref）
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit" }

# build-logic 约定插件依赖的 Spring Boot Gradle 插件（真实 artifact，非 marker）
spring-boot-gradle-plugin = { group = "org.springframework.boot", name = "spring-boot-gradle-plugin", version.ref = "spring-boot" }
# Boot 4 插件不再自动应用依赖管理，需显式应用；版本由自己管理
dependency-management-plugin = { group = "io.spring.gradle", name = "dependency-management-plugin", version.ref = "dependency-management" }
# Spring Cloud / Alibaba BOM（模块自己管理版本，由 foam.spring-cloud-app 约定插件引入）
spring-cloud-dependencies = { group = "org.springframework.cloud", name = "spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-cloud-alibaba-dependencies = { group = "com.alibaba.cloud", name = "spring-cloud-alibaba-dependencies", version.ref = "spring-cloud-alibaba" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
